[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-simulator"
version = "0.1.0"
description = "Governed incident diagnosis agents built with LangChain and LangGraph"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7.4,<3", "langchain==1.5.0", "langgraph==1.2.22", "langchain-openai==1.8.0", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3", "psycopg[binary]>=3,<4", "langgraph-checkpoint-postgres==3.2.1", "langgraph-checkpoint-sqlite==3.1.3", "argon2-cffi>=25,<26", "alembic>=1.16,<2", "mcp==1.30.0", "langfuse==3.15.0", "qdrant-client==1.20.0", "fastembed==0.9.1", "rank-bm25==0.2.2"]

[tool.setuptools.package-data]
incident_simulator = ["web/*.html", "web/assets/*"]

[project.scripts]
incident-simulator = "incident_simulator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
